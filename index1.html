<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동적 반응형 웹사이트 (이미지 제외)</title>
    
    <style>
        /* ==========================================================================
           1. 기본 초기화 및 변수 설정 
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* 패딩과 테두리를 크기에 포함시켜 깨짐 방지 */
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            line-height: 1.6;
            background-color: #f8f9fa;
            color: #333;
            /* 뷰포트 크기에 따라 기본 폰트 크기가 미세하게 조절되도록 설정 */
            font-size: clamp(14px, 1vw + 10px, 18px); 
        }

        /* 컨테이너 가로폭 제한 (PC화면에서 너무 퍼지지 않게 방지) */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ==========================================================================
           2. 헤더 스타일 (Flexbox 활용)
           ========================================================================== */
        .header {
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px 0;
        }

        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap; /* 공간 부족 시 아래로 자연스럽게 떨어짐 */
        }

        .logo {
            font-size: 1.5rem;
            color: #333;
            font-weight: bold;
        }

        .nav a {
            text-decoration: none;
            color: #555;
            margin-left: 20px;
            font-weight: bold;
            transition: color 0.3s;
        }

        .nav a:hover {
            color: #007bff;
        }

        /* ==========================================================================
           3. 메인 콘텐츠 및 카드 스타일 (Grid 활용)
           ========================================================================== */
        .main-content {
            padding: 40px 0;
        }

        .intro {
            text-align: center;
            margin-bottom: 40px;
        }

        .intro h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        /* 반응형 그리드: PC 기준 기본 3단 배열 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
        }

        .card-body {
            padding: 25px;
        }

        .card-body h3 {
            margin-bottom: 12px;
            font-size: 1.25rem;
            color: #007bff;
        }

        .card-body p {
            color: #666;
            font-size: 0.95rem;
        }

        /* ==========================================================================
           4. 미디어 쿼리 (Media Queries) - 해상도별 동적 변환
           ========================================================================== */

        /* 태블릿 구간 (화면 너비 992px 이하) */
        @media (max-width: 992px) {
            .card-grid {
                grid-template-columns: repeat(2, 1fr); /* 3열에서 2열로 변경 */
            }
        }

        /* 모바일 구간 (화면 너비 600px 이하) */
        @media (max-width: 600px) {
            .header .container {
                flex-direction: column; /* 로고와 메뉴를 세로로 정렬 */
                gap: 15px;
            }

            .nav a {
                margin: 0 10px; /* 모바일 메뉴 간격 조정 */
            }

            .card-grid {
                grid-template-columns: 1fr; /* 2열에서 1열(세로 배치)로 변경 */
            }
            
            .intro h2 {
                font-size: 1.5rem; /* 모바일 화면에 맞춰 타이틀 크기 축소 */
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container">
            <h1 class="logo">Responsive Web</h1>
            <nav class="nav">
                <a href="#">홈</a>
                <a href="#">소개</a>
                <a href="#">서비스</a>
                <a href="#">문의</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <section class="intro">
                <h2>어떤 기기에서도 완벽한 화면</h2>
                <p>PC, 태블릿, 모바일 등 해상도에 따라 텍스트와 레이아웃이 유연하게 반응합니다.</p>
            </section>

            <div class="card-grid">
                <div class="card">
                    <div class="card-body">
                        <h3>동적 텍스트 반응</h3>
                        <p>해상도가 작아지면 박스의 가로폭과 텍스트 크기가 자연스럽게 스마트폰 화면에 맞춰 줄어듭니다.</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h3>레이아웃 자동 정렬</h3>
                        <p>별도의 이미지 없이도 박스 모델의 비율을 유지하며, 줄바꿈과 위치가 자동으로 정렬됩니다.</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h3>그리드 시스템 활용</h3>
                        <p>CSS Grid와 Media Query를 활용하여 PC에서는 3단, 태블릿은 2단, 모바일은 1단으로 동적 변환됩니다.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
